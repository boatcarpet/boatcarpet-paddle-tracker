name: Sunday paddle invite

on:
  schedule:
    # GitHub cron is UTC only, so each send fires twice, an hour apart, and
    # send_invite.py sends on the first one at/after the local send time and
    # skips the other. Clocks go back Nov 1, which is why there are two.
    # Mon -> invite to everyone on the list, ~9:15am ET
    - cron: "17 13 * * 1"   # 9:17am EDT / 8:17am EST
    - cron: "17 14 * * 1"   # 10:17am EDT / 9:17am EST
    - cron: "47 16 * * 1"   # 12:47pm EDT / 11:47am EST - backup if GitHub drops the others
    # Fri -> roster of who's playing, ~1:15pm ET
    - cron: "17 17 * * 5"   # 1:17pm EDT / 12:17pm EST
    - cron: "17 18 * * 5"   # 2:17pm EDT / 1:17pm EST
    - cron: "47 19 * * 5"   # 3:47pm EDT / 2:47pm EST - backup if GitHub drops the others
  workflow_dispatch:        # "Run workflow" button for testing on demand
    inputs:
      mode:
        description: "Which send to run"
        default: "auto"
        type: choice
        options:
          - auto
          - monday
          - friday

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install firebase-admin requests
      - name: Send the invite / roster
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MODE: ${{ github.event.inputs.mode || 'auto' }}
          # Lets the script tell a scheduled run from a manual one: the time
          # guards apply to the schedule, never to the "Run workflow" button.
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python send_invite.py
