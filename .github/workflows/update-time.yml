name: Update Sunday start time

# Checks the Lions schedule through the week and writes the paddle
# start time to the tracker page. Sends no email.

on:
  schedule:
    # Every 6 hours, every day. Running often is deliberate: a dropped
    # scheduled run heals itself, and a late Lions flex change gets caught.
    - cron: "17 */6 * * *"
    
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install firebase-admin requests
      - name: Check the Lions schedule and update the start time
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python update_time.py
